# User overrides for the portable Keypirinha installation.

[app]
launch_at_startup = yes
hotkey_run = Ctrl+Alt+S

[gui]
theme = Default
always_on_top = yes
hide_on_focus_lost = immediate
retain_last_search = no
show_on_taskbar = no
max_height = 8
geometry = auto
auto_width = 42

[theme/Default]
font_face = Segoe UI, Arial
font_small_size = 10
font_snormal_size = 11
font_normal_size = 12
font_large_size = 16
layout = list_icon, list_selmark, list_actions
compact_results = yes
satellite_show = never
control_margin = 3
textbox_padding = 2
listitem_padding = 1
color_background = #17151f
color_foreground = #f5f1ff
color_faded = #aaa1b8
color_accent = #c084fc
color_warn = #fb7185
color_title = ${color_foreground}
color_status = ${color_faded}
color_textbox_back = #242033
color_listitem_back = #17151f
color_listitem_title = ${color_foreground}
color_listitem_desc = ${color_faded}
color_listitem_tips = ${color_accent}
color_listitem_selected_back = #35264f
color_listitem_selected_title = #f0abfc
color_listitem_selected_desc = ${color_foreground}
color_listitem_selected_tips = #f0abfc
opacity_back = 97
listitem_title_font = snormal
